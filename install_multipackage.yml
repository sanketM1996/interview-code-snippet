---
- name: Install Nginx
  hosts: webservers
  become: yes

  tasks:
    - name: Install nginx package
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian"

    - name: Install nginx package on RedHat
      yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start nginx service
      service:
        name: nginx
        state: started
        enabled: yes
